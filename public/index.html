<style>
:root{--ink:#0a0e1d;--panel:#131a33;--panel2:#1b2447;--line:#2c3a6b;--text:#eef1ff;--muted:#93a0d0;--p1:#3aa0ff;--p2:#ff5468;--gold:#ffc83d;--good:#4ade80;--bad:#ff5d6c;
--display:'Bungee','Impact',sans-serif;--body:'Chakra Petch','Segoe UI',system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;font-size:16px}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink)}
#ui{position:absolute;inset:0;pointer-events:none}
.screen,.overlay{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-start;padding:16px;overflow:auto;pointer-events:auto}
.screen{background:rgba(6,9,22,.72);backdrop-filter:blur(3px)}
.screen.menu{background:linear-gradient(90deg,rgba(6,9,22,.92) 0%,rgba(6,9,22,.55) 45%,rgba(6,9,22,.05) 100%);backdrop-filter:none;justify-content:flex-start;align-items:flex-start}
.overlay{background:rgba(4,6,16,.45);padding-top:clamp(70px,13vh,150px)}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:clamp(14px,2.4vw,28px);width:min(980px,100%);box-shadow:0 18px 60px rgba(0,0,0,.5)}
.panel.narrow{width:min(560px,100%)}
h1.logo{font:clamp(2.4rem,7vw,4.4rem)/.88 var(--display);margin:0 0 .3em;letter-spacing:.02em;background:linear-gradient(90deg,var(--p1) 0 49%,var(--p2) 51% 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #050816)}
.tagline{margin:.4em 0 0;font-size:clamp(13px,1.6vw,19px);letter-spacing:.42em;font-weight:700;color:#f0c879;text-shadow:0 1px 6px #000}
h2{font:clamp(1.3rem,3.4vw,2rem) var(--display);margin:0 0 .6em;letter-spacing:.03em}
h3{font:700 .95rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:1.2em 0 .5em}
p{line-height:1.5;margin:.4em 0}
.muted{color:var(--muted)}
.tag{color:var(--muted);max-width:30ch;margin:0 0 1.4em}
.menu-col{margin-block:auto;width:min(420px,100%);display:flex;flex-direction:column;gap:12px;padding-left:clamp(0px,3vw,40px)}
nav.stack{display:flex;flex-direction:column;gap:10px;padding:0}
nav.stack .btn.big{font-size:1.25rem;padding:1em 1.7em;justify-content:center}
nav.stack .modes{display:none;flex-direction:column;gap:8px;margin-top:10px;padding:12px;border-radius:16px;background:rgba(26,10,24,.84);border:1px solid rgba(255,200,61,.22);box-shadow:0 20px 50px rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
nav.stack.open .modes{display:flex}
nav.stack .modes .btn{background:rgba(58,26,52,.9)!important}
nav.stack .modes .btn.primary{background:linear-gradient(90deg,#fff0b0,#ffc83d)}
nav.stack .modes .btn::before{background:linear-gradient(180deg,#4a2246,#2a1229)}
nav.stack .modes .btn.primary::before{background:linear-gradient(180deg,#ffdc6e,#ffb21e)}
/* PLAY button: living gold with a flowing gradient, pulsing glow and a repeating shine */
nav.stack .btn.big{font-size:1.3rem;letter-spacing:.24em;color:#2a1600;text-shadow:0 1px 0 rgba(255,235,170,.6),0 0 14px rgba(255,190,60,.35);animation:playPulse 3s ease-in-out infinite,breathe 3s ease-in-out infinite;transition:transform .18s,filter .18s}
nav.stack .btn.big::before{background:linear-gradient(90deg,#8a520a,#e8a524,#fff0b0,#d98f17,#8a520a,#e8a524,#fff0b0,#d98f17,#8a520a);background-size:300% 100%;animation:goldFlow 6s linear infinite}
nav.stack .btn.big::after{left:-30%;width:18%;background:linear-gradient(90deg,transparent,rgba(255,250,220,.95),transparent);animation:shineSweep 3.4s ease-in-out infinite}
nav.stack .btn.big:hover{transform:translate(4px,-3px) scale(1.03);filter:drop-shadow(0 6px 0 rgba(3,5,16,.9)) drop-shadow(0 0 26px rgba(255,200,61,.8))}
nav.stack .btn.big:active{transform:translate(3px,2px) scale(.985)}
@keyframes goldFlow{from{background-position:0% 50%}to{background-position:300% 50%}}
@keyframes breathe{0%,100%{scale:1}50%{scale:1.02}}
@keyframes shineSweep{0%{transform:translateX(-120%) skewX(-18deg)}60%,100%{transform:translateX(560%) skewX(-18deg)}}
@keyframes playPulse{0%,100%{filter:drop-shadow(0 4px 0 rgba(3,5,16,.9)) drop-shadow(0 0 8px rgba(255,190,60,.25))}50%{filter:drop-shadow(0 4px 0 rgba(3,5,16,.9)) drop-shadow(0 0 20px rgba(255,190,60,.6))}}
@media (prefers-reduced-motion:reduce){nav.stack .btn.big,nav.stack .btn.big::before,nav.stack .btn.big::after{animation:none}}
/* compact PLAY button: sized to its label */
nav.stack .btn.big{align-self:flex-start;width:auto;min-width:0;padding:.7em 2.6em;font-size:1.08rem;letter-spacing:.2em}
.btn{font:700 1rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--text);background:var(--panel2);border:2px solid var(--line);border-radius:6px;padding:.75em 1.2em;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s,background .12s;box-shadow:0 4px 0 #070b1c;text-align:center}
.btn:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 6px 0 #070b1c,0 0 18px rgba(255,200,61,.28)}
.btn:active{transform:translateY(3px) scale(.985);box-shadow:0 1px 0 #070b1c}
.btn:focus-visible,.tile:focus-visible,.arena:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.primary{background:linear-gradient(#ffd75e,#ffb21e);color:#2a1a00;border-color:#ffe39a;font-size:1.15rem}
.btn.small{padding:.45em .8em;font-size:.82rem}
.btn:disabled,.btn.off{opacity:.45;cursor:not-allowed;transform:none}
.btn.deny{animation:deny .35s}
@keyframes deny{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.profiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:1em}
.pcard{background:rgba(19,26,51,.85);border:2px solid var(--line);border-left-width:6px;border-radius:4px;padding:10px 12px;font-size:.82rem;min-width:0}
.pcard.a{border-left-color:var(--p1)}.pcard.b{border-left-color:var(--p2)}

.pcard .gold{color:var(--gold)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:700 .85rem var(--body);letter-spacing:.08em;text-transform:uppercase;padding:.55em 1em;border:2px solid var(--line);background:transparent;color:var(--muted);border-radius:4px;cursor:pointer;transition:all .12s}
.tab:hover{color:var(--text);border-color:var(--muted)}
.tab.on{background:var(--panel2);color:var(--text);border-color:var(--gold)}
.tab.who1.on{border-color:var(--p1)}.tab.who2.on{border-color:var(--p2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px}
.card{background:var(--panel2);border:2px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative;overflow:hidden}
.card.equipped{border-color:var(--good)}
.card canvas{width:100%;height:120px;background:radial-gradient(circle at 50% 80%,#27346b,#0e1430);border-radius:4px}
.card h4{margin:0;font:700 1.05rem var(--body);letter-spacing:.04em}
.card .desc{font-size:.82rem;color:var(--muted);min-height:2.4em}
.stat{display:grid;grid-template-columns:3.4em 1fr;gap:8px;align-items:center;font-size:.7rem;letter-spacing:.1em;color:var(--muted)}
.stat i{height:6px;background:#0b1130;border-radius:3px;overflow:hidden;display:block}
.stat b{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff8a3d)}
.price{color:var(--gold);font-weight:700}
.card.bought{animation:bought .7s}
@keyframes bought{0%{box-shadow:0 0 0 0 rgba(255,200,61,.9)}40%{transform:scale(1.04);box-shadow:0 0 40px 10px rgba(255,200,61,.6);background:#3a3a1c}100%{box-shadow:0 0 0 0 rgba(255,200,61,0)}}
.float{position:absolute;right:12px;top:10px;color:var(--gold);font:700 1.2rem var(--body);animation:floatup 1s forwards;pointer-events:none}
@keyframes floatup{to{transform:translateY(-40px);opacity:0}}
.arenas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.arena{cursor:pointer;border:3px solid var(--line);border-radius:4px;height:110px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;text-shadow:0 2px 0 rgba(0,0,0,.7);font-weight:700;letter-spacing:.06em;transition:transform .12s,border-color .12s;background-size:cover}
.arena:hover{transform:translateY(-3px)}
.arena.on{border-color:var(--gold);box-shadow:0 0 20px rgba(255,200,61,.35)}
.arena small{font-weight:500;letter-spacing:0;opacity:.85}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inv{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:16px;margin-top:14px}
.inv canvas{width:100%;aspect-ratio:1;background:radial-gradient(circle at 50% 85%,#27346b,#0e1430);border-radius:6px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{font:700 .85rem var(--body);padding:.6em .9em;border:2px solid var(--line);background:var(--panel2);color:var(--text);border-radius:4px;cursor:pointer;transition:transform .1s,border-color .1s;text-align:left}
.tile:hover{transform:translateY(-2px);border-color:var(--muted)}
.tile.on{border-color:var(--good);background:#16352b}
.tile small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
kbd{display:inline-block;min-width:2em;text-align:center;font:700 .85rem var(--body);padding:.25em .5em;border-radius:4px;background:#0b1130;border:2px solid var(--line);border-bottom-width:4px;margin:0 2px}
.ctl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sw input[type=range]{width:180px;max-width:50vw;accent-color:var(--gold)}
.eyebrow{font:700 .8rem var(--body);letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin:0}
.winline{font:clamp(1.4rem,4.4vw,2.6rem)/1.05 var(--display);margin:.2em 0}
.winline.p1{color:var(--p1)}.winline.p2{color:var(--p2)}
.scoreline{font:700 1.15rem var(--body);letter-spacing:.06em;margin:.4em 0 1em}
.earn{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:.6em 0 1em}
.coinbox{font:700 1.6rem var(--body);color:var(--gold);display:flex;gap:10px;align-items:center;animation:pop .6s .2s both}
.coin{width:1.1em;height:1.1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc83d 55%,#c88a00);display:inline-block;box-shadow:inset 0 0 0 2px #a8730a}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.pcardwrap{perspective:700px}
.pw{width:230px;max-width:100%;height:96px;position:relative;transform-style:preserve-3d;animation:flip .8s .7s both}
.pw>div{position:absolute;inset:0;backface-visibility:hidden;border-radius:6px;display:flex;align-items:center;gap:12px;padding:12px}
.pw .back{background:repeating-linear-gradient(45deg,#1b2447 0 8px,#222d58 8px 16px);border:2px solid var(--line);justify-content:center;font:2rem var(--display);color:var(--muted)}
.pw .front{transform:rotateY(180deg);background:var(--panel2);border:2px solid var(--pc,var(--gold));box-shadow:0 0 24px var(--pc,var(--gold));animation:shine 1.2s 1.4s}
@keyframes flip{to{transform:rotateY(180deg)}}
@keyframes shine{50%{filter:brightness(1.6)}}
.badge{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 .8rem var(--body);letter-spacing:.04em;color:#07101f;background:var(--pc,var(--gold));flex:none}
.pw b{display:block;font-size:1.05rem}.pw span{font-size:.78rem;color:var(--muted)}
.auto{height:4px;background:#0b1130;margin-top:14px;border-radius:2px;overflow:hidden}
.auto i{display:block;height:100%;width:100%;background:var(--gold);transform-origin:left;animation:auto 7s linear forwards}
@keyframes auto{to{transform:scaleX(0)}}
table.res{width:100%;border-collapse:collapse;margin:.8em 0 1em;font-size:.95rem}
table.res th,table.res td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.res th:first-child,table.res td:first-child{text-align:left}
table.res tr.tot td{color:var(--gold);font-weight:700;border-bottom:0}
.wrapx{overflow-x:auto}
#pauseBtn{position:absolute;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:rgba(19,26,51,.85);color:var(--text);font:700 .9rem var(--body);cursor:pointer;display:none;transition:transform .12s,border-color .12s}
#pauseBtn:hover{transform:scale(1.1);border-color:var(--gold)}
#pauseBtn:active{transform:scale(.92)}
@media (max-height:780px){.profiles{display:none}.menu-col{gap:8px}}
@media (max-width:640px){.two,.profiles,.inv{grid-template-columns:1fr}.screen.menu{background:rgba(6,9,22,.85)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}

 background:linear-gradient(180deg,#ffffff 0%,#f2f5ff 22%,#9aa4bd 40%,#3d4560 49%,#e9eefb 50%,#ffffff 62%,#a9b3cc 80%,#5b6480 100%);
 -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #05070f;paint-order:stroke fill;
 filter:drop-shadow(-14px 4px 14px rgba(50,130,255,.95)) drop-shadow(14px 6px 16px rgba(255,40,20,.95)) drop-shadow(0 7px 0 #03040c) drop-shadow(0 0 22px rgba(120,160,255,.25))}
h1.logo::after{content:'';display:block;height:4px;width:112%;margin:.1em 0 0 -4%;background:linear-gradient(90deg,transparent,#2f7bff 25%,#ffe08a 50%,#ff2d1c 75%,transparent);box-shadow:0 0 12px rgba(255,200,120,.6);transform:skewX(12deg)}

.tag{max-width:34ch}

/* buttons: slanted plates with a split-colour edge */
.btn{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;gap:.6em;border:0;border-radius:0;background:var(--line);color:var(--text);padding:.85em 1.7em;box-shadow:none;clip-path:polygon(var(--cut) 0,100% 0,calc(100% - var(--cut)) 100%,0 100%);transition:transform .14s,filter .14s,color .14s;filter:drop-shadow(0 4px 0 rgba(3,5,16,.9))}
.btn::before{content:"";position:absolute;inset:2px;z-index:-2;background:linear-gradient(180deg,#232e63,#171f47);clip-path:polygon(calc(var(--cut) - 1px) 0,100% 0,calc(100% - var(--cut) + 1px) 100%,0 100%)}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-30%;width:26%;z-index:-1;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);transform:translateX(-120%) skewX(-18deg);transition:none}
.btn:hover{transform:translate(4px,-2px);border:0;box-shadow:none;filter:drop-shadow(0 6px 0 rgba(3,5,16,.9)) drop-shadow(0 0 14px rgba(255,200,61,.45));background:var(--gold)}
.btn:hover::after{transform:translateX(560%) skewX(-18deg);transition:transform .7s ease}
.btn:active{transform:translate(4px,2px) scale(.985);box-shadow:none;filter:drop-shadow(0 1px 0 rgba(3,5,16,.9))}
.btn.primary{background:linear-gradient(90deg,#fff0b0,#ffc83d);color:#2b1a00;border:0;font-size:1.1rem}
.btn.primary::before{background:linear-gradient(180deg,#ffdc6e,#ffb21e)}
.btn.small{padding:.5em 1.2em;font-size:.82rem;--cut:8px}
.btn.off,.btn:disabled{filter:none;transform:none;opacity:.5}
.btn.deny{animation:deny .35s}
.btn:focus-visible{outline:0;background:#fff}
nav.stack .btn{justify-content:flex-start;text-align:left;padding-left:2.2em;--cut:16px}
nav.stack .btn small{margin-left:auto;font:500 .72rem var(--body);letter-spacing:.02em;text-transform:none;opacity:.7;text-align:right}
nav.stack .btn.primary small{opacity:.75}
.menu .stack .btn{animation:slidein .5s cubic-bezier(.2,.9,.3,1) both}
.menu .stack .btn:nth-child(2){animation-delay:.06s}.menu .stack .btn:nth-child(3){animation-delay:.12s}.menu .stack .btn:nth-child(4){animation-delay:.18s}.menu .stack .btn:nth-child(5){animation-delay:.24s}.menu .stack .btn:nth-child(6){animation-delay:.3s}.menu .stack .btn:nth-child(7){animation-delay:.36s}
@keyframes slidein{from{opacity:0;transform:translateX(-36px)}}
.menu-col{width:min(460px,100%)}
.tab{border-radius:0;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);border:0;background:rgba(255,255,255,.06);padding:.6em 1.3em}
.tab.on{background:var(--gold);color:#2b1a00}
.tab.who1.on{background:var(--p1);color:#04122a}.tab.who2.on{background:var(--p2);color:#2a0409}
.tile{border-radius:0;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);border:0;background:#1c2656;padding:.6em 1.2em}
.tile.on{background:#1d5a43}
.card,.arena,.pcard{border-radius:3px}
.card{background:linear-gradient(180deg,#1b2452,#131a3c)}
.arena{border-width:2px;box-shadow:inset 0 -60px 50px -30px rgba(0,0,0,.55)}
.arena:hover{transform:translateY(-4px) rotate(-.6deg)}
@media (max-height:640px){nav.stack .btn small{display:none}.btn{padding:.7em 1.7em}}
@media (max-width:640px){.screen.menu{background:rgba(5,8,22,.6)}#bg .duel{opacity:.4;width:130vw}nav.stack .btn small{display:none}}
@media (prefers-reduced-motion:reduce){#bg *,.duel *{animation:none!important}}

<script>(()=>{
/* Seeded RNG for anything that changes the outcome of a fight. Math.random is
   left for cosmetic particles. Both machines reseed at the start of each round. */
const SRNG={s:1,seed(v){this.s=(v>>>0)||1},next(){let t=this.s=(this.s+0x6D2B79F5)|0;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}};

/* Lockstep online 1v1. Each browser runs the same simulation. Each side samples
   its own keys every fixed step and sends them to the peer, applied D ticks
   later. A tick only runs once both players' inputs for it are known. The
   server only relays messages between the two seats of a room. */
const Net={
 running:false,inRoom:false,halt:false,role:null,code:'',ws:null,pingT:null,
 peerReady:false,peerLoadout:null,
 seed:0,loadouts:null,simTick:0,sampleIdx:0,acc:0,D:10,inbox:[{},{}],pressed:[],

 mine(){return Object.values(KEYS[this.role])},
 send(o){if(this.ws&&this.ws.readyState===1)this.ws.send(JSON.stringify(o))},

 open(){
  if(this.ws&&this.ws.readyState<=1)return Promise.resolve();
  return new Promise((res,rej)=>{
   const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
   this.ws=ws;let ok=false;
   ws.onopen=()=>{ok=true;clearInterval(this.pingT);this.pingT=setInterval(()=>this.send({t:'ping'}),25000);res()};
   ws.onerror=()=>{if(!ok)rej(new Error('Could not reach the game server.'))};
   ws.onclose=()=>{if(ws===this.ws&&(this.inRoom||this.running))this.ended('Your opponent disconnected.')};
   ws.onmessage=e=>this.onMsg(JSON.parse(e.data));
  });
 },

 onMsg(m){
  switch(m.t){
   case'room':this.inRoom=true;this.role=0;this.code=m.code;this.hostLobby();break;
   case'joined':this.inRoom=true;this.role=1;this.code=m.code;this.send({t:'hello',lo:Save.data.profiles[0].equip,nick:p1n()});this.lobby();break;
   case'peer':this.peerReady=false;this.send({t:'hello',lo:Save.data.profiles[0].equip,nick:p1n()});this.lobby();break;
   case'hello':this.peerLoadout=m.lo;this.peerNick=(m.nick||'Player 2');this.peerReady=true;if(!this.running)this.lobby();break;
   case'lobby':this.lobbyMode=m.mode;this.lobbyArena=m.arena;if(!this.running)this.lobby();break;
   case'start':this.beginNet(m);break;
   case'in':if(this.role!==null)this.inbox[1-this.role][m.k]={h:m.h,p:m.p};break;
   case'act':this.applyAct(m);break;
   case'left':this.peerReady=false;this.ended(this.role===0?'Your opponent left the room.':'The host left the room.');break;
   case'error':this.fail(m.msg);break;
  }
 },

 /* lobby screens */
 menu(){
  UI.overlay(`<div class="panel narrow"><p class="eyebrow">Play online</p><h2>Play online</h2>
  <p class="muted">Host a room and send the code to your friend, or join a room with its code.</p>
  <div class="row"><button class="btn primary" data-act="netcreate">Host a room</button></div>
  <div class="row" style="margin-top:14px"><input id="netcode" maxlength="6" placeholder="CODE" autocomplete="off" style="font:700 1.2rem var(--body);letter-spacing:.2em;text-transform:uppercase;width:9ch;padding:.5em .6em;background:var(--panel2);color:var(--text);border:2px solid var(--line);border-radius:4px"><button class="btn" data-act="netjoin">Join</button></div>
  <div class="row" style="margin-top:14px"><button class="btn" data-act="netback">Back</button></div></div>`);
 },
 lobby(){
  if(this.running||!this.inRoom)return;
  const host=this.role===0;
  const modes=[['classic','1 vs 1','Duel to the death'],['coop','Co-op vs Bots','Team up through the waves and the boss'],['koth','King of the Hill','Hold the zone, first to 60s'],['pk','Parkour Race','Race the obstacle course']];
  const cur=this.lobbyMode||'classic',arena=this.lobbyArena||Object.keys(ARENAS)[0];
  const guestName=this.peerReady?esc(this.peerNick||'Player 2'):'Waiting...';
  UI.overlay(`<div class="panel"><p class="eyebrow">Online room</p><h2>Code <span class="winline p1" style="letter-spacing:.15em">${this.code}</span></h2>
  <div class="two"><div class="pcard a"><b>${esc(p1n())}${host?' · HOST':''}</b>Connected</div><div class="pcard b"><b>${guestName}</b>${this.peerReady?'Connected':'Not connected yet'}</div></div>
  <h3>Mode</h3><div class="tiles">${modes.map(([id,n,d])=>`<button class="tile ${cur===id?'on':''}" data-act="netmode" data-a="${id}" ${host?'':'disabled'}>${n}<small>${d}</small></button>`).join('')}</div>
  <h3>Map</h3><div class="tiles">${Object.keys(ARENAS).map(id=>`<button class="tile ${arena===id?'on':''}" data-act="netarena" data-a="${id}" ${host?'':'disabled'}>${esc(ARENAS[id].name)}<small>${esc(ARENAS[id].blurb)}</small></button>`).join('')}</div>
  <div class="row" style="margin-top:16px"><button class="btn" data-act="netloadout">Edit my loadout</button>${host?`<button class="btn primary" data-act="start" ${this.peerReady?'':'disabled'}>Start Match</button>`:'<p class="muted">Waiting for the host to start the match...</p>'}<button class="btn" data-act="netcancel">Leave Room</button></div></div>`);
 },
 hostLobby(){this.lobby()},
 guestWait(){this.lobby()},
 fail(msg){
  UI.overlay(`<div class="panel narrow"><p class="eyebrow">Online</p><h2>Could not connect</h2><p class="muted">${msg}</p>
  <div class="row"><button class="btn primary" data-act="netmenu">Try again</button><button class="btn" data-act="netback">Back</button></div></div>`);
 },
 ended(msg){
  if(this.halt)return;
  if(this.running){this.halt=true}
  else if(this.role===0&&this.inRoom){this.peerReady=false;this.hostLobby();return}
  UI.overlay(`<div class="panel narrow"><p class="eyebrow">Online</p><h2>Match ended</h2><p class="muted">${msg}</p>
  <div class="row"><button class="btn primary" data-act="netback">Main menu</button></div></div>`);
 },

 /* routing for every net* button */
 uiAct(act,a){
  switch(act){
   case'netmenu':return this.menu();
   case'netcreate':return this.open().then(()=>this.send({t:'create'})).catch(e=>this.fail(e.message));
   case'netjoin':{
    const c=(document.getElementById('netcode')||{value:''}).value.trim().toUpperCase();
    if(!c)return;
    return this.open().then(()=>this.send({t:'join',code:c})).catch(e=>this.fail(e.message));
   }
     case'netmode':if(this.role!==0)return;this.lobbyMode=(a||'classic');this.send({t:'lobby',mode:this.lobbyMode,arena:this.lobbyArena||Object.keys(ARENAS)[0]});return this.lobby();
   case'netarena':if(this.role!==0)return;this.lobbyArena=(a||Object.keys(ARENAS)[0]);this.send({t:'lobby',mode:this.lobbyMode||'classic',arena:this.lobbyArena});return this.lobby();
   case'netloadout':this.inLoadout=true;UI.clearOverlay();UI.show('loadout');return;
   case'netpick':UI.clearOverlay();UI.mode='classic';UI.show('arenas');return;
   case'netcancel':case'netback':
    if(this.inRoom||this.running){this.origAct.call(UI,'quit');return}
    UI.clearOverlay();return;
  }
 },

 /* host starts: choose a seed, send the setup to the guest, begin locally */
 hostStart(){
  if(this.role!==0||!this.peerReady)return;
  const seed=(Math.random()*1e9)|0,mode=this.lobbyMode||'classic',arena=this.lobbyArena||Object.keys(ARENAS)[0];

/* ================= SAVE / LOAD ================= */
const Save={
 key:'stickclash.save.v1',data:null,

  const d=this.defaults();
  try{
   const r=JSON.parse(localStorage.getItem(this.key)||'null');
   if(r&&Array.isArray(r.profiles)){
    [0,1].forEach(i=>{
     const rp=r.profiles[i];if(!rp)return;const p=d.profiles[i];
     p.coins=Math.max(0,Number(rp.coins)||0);p.matches=Number(rp.matches)||0;p.wins=Number(rp.wins)||0;
     for(const t in CAT){
      const own=(rp.owned&&Array.isArray(rp.owned[t])?rp.owned[t]:[]).filter(id=>CAT[t][id]);
      p.owned[t]=Object.keys(CAT[t]);
      const eq=rp.equip&&rp.equip[t];p.equip[t]=p.owned[t].includes(eq)?eq:p.owned[t][0];
     }
     const e2=rp.equip&&rp.equip.sword2;if(SWORDS[e2])p.equip.sword2=e2;
    });
    Object.assign(d.settings,r.settings||{});d.seen=!!r.seen;
   }
  }catch(e){}
  this.data=d;return d;
 },
 write(){try{localStorage.setItem(this.key,JSON.stringify(this.data))}catch(e){}},
 reset(){this.data=this.defaults();this.write()},
 resetRun(){const s=this.data.settings,seen=this.data.seen;this.data=this.defaults();this.data.settings=s;this.data.seen=seen;this.data.profiles.forEach(p=>p.coins=RUN.start);this.write()}
};
Save.load();

const Shop={
 factor:1,

  const p=Save.data.profiles[i],it=CAT[t][id];
  if(!it||this.owns(i,t,id))return{ok:false,msg:'Already owned'};
  const pr=this.price(it);if(p.coins<pr)return{ok:false,msg:'Need '+(pr-p.coins)+' more coins'};

 },

   if(st%4===0||st===10)this.tone(140,.14,'sine',.6,40,dl,M);

   if(st===4||st===12)this.noise(.14,.35,1800,900,'bandpass',dl,M);

   this.noise(st%2?.04:.02,st%2?.05:.025,5000,null,'highpass',dl,M);

  }else{

   if(st%2===0)this.tone(m(ch[(st>>2)%3]+12),.2,'triangle',.03,null,dl,M);
  }

};

/* Stairs at both ends of every arena: one clean run of four steps on each side, each step 70px wide and 60px higher
   than the last, starting from the ground at the arena edge. Where a step runs through an existing ledge,
   that ledge is cut back so the stairs stay clear. */
const STEP_W=70,STEP_H=60,STEP_N=4;
for(const a of Object.values(ARENAS)){
 const steps=[];
 for(let k=0;k<STEP_N;k++){
  steps.push({x:k*STEP_W,h:(k+1)*STEP_H});

 }
 let plats=(a.platforms||[]).slice();
 for(const s of steps){
  const sy=G-s.h,out=[];
  for(const o of plats){

/* ================= BOT AI ================= */
const BotAI={
 think(b,g,dt){
  const ai=b.ai,K=b.keys,ks=ai.keys,D=ai.def,L=K.left,R=K.right,DN=K.down,JP=K.jump;
  if(b.dead||g.state!=='fight'){ks.clear();return}
  if(ai.jumpHold>0){ai.jumpHold-=dt;if(ai.jumpHold<=0)ks.delete(JP)}
  if(ai.blockT>0){ai.blockT-=dt;if(ai.blockT<=0)ks.delete(DN)}
  ai.t-=dt;if(ai.t>0)return;
  const st=D.react;ai.t=st*rand(.75,1.25);
  /* pick the closest living player, with a little stickiness */
  let tg=null,bd=1e9;
  for(const p of g.fighters){if(p.dead)continue;const d=Math.abs(p.x-b.x)+Math.abs(p.gy-b.y)*.9-(p===ai.tgt?140:0);if(d<bd){bd=d;tg=p}}
  ai.tgt=tg;
  const setDir=d=>{ks.delete(L);ks.delete(R);if(d<0)ks.add(L);else if(d>0)ks.add(R)};
  const jump=h=>{b.jumpBuf=.12;ks.add(JP);ai.jumpHold=h||.5};
  if(!tg){setDir(0);return}
  const sc=b.sc||1,reach=b.stats.sword.reach*sc,tsc=tg.sc||1,treach=tg.stats.sword.reach*tsc;
  const dx=tg.x-b.x,adx=Math.abs(dx),dir=dx<0?-1:1,air=!b.onGround;
  const gyT=tg.onGround?tg.y:tg.gy,dy=gyT-b.y;
  /* stuck guard: if the bot cannot get closer to its target for ~3s (stairs, ledges, bouncing), move it to a reachable spot beside the target */
  if(!b.boss&&adx>reach*1.1){
   if(ai.prevTg!==tg||ai.bestAdx===undefined||adx<ai.bestAdx-6){ai.prevTg=tg;ai.bestAdx=adx;ai.noProg=0}else ai.noProg+=st;
   if(ai.noProg>3){ai.noProg=0;ai.bestAdx=undefined;ai.ox=rand(-40,40);jump(.62);ai.lockT=0;return}
  }else{ai.noProg=0;ai.bestAdx=undefined}
  /* committed to a platform jump: keep steering over it while airborne */
  if(ai.lockT>0){ai.lockT-=st;if(air){setDir(Math.abs(ai.lockX-b.x)>14?Math.sign(ai.lockX-b.x):0);return}}
  ai.modeT-=st;if(ai.modeT<=0){ai.mode=Math.random()<D.wait?'wait':'press';ai.modeT=rand(.6,1.5)}
  const blocking=ai.blockT>0;
  /* defence: react to an incoming swing */
  const facing=(b.x-tg.x)*tg.f>0,tph=tg.atk.phase;
  const threat=facing&&(tph==='wind'||tph==='swing')&&adx<treach+45&&Math.abs(tg.y-b.y)<95;
  if(threat&&!blocking&&b.atk.phase==='none'&&!air&&!b.stunT){
   const r=Math.random();
   if(r<D.block){ks.add(DN);ai.blockT=.34;setDir(0);return}
   if(r<D.block+D.jump*.35){setDir(-dir);jump(.4);return}
  }
  if(blocking)return;
  /* navigation between platform tiers */
  let navX=null;
  if(!air){
   if(dy<-70){
    const rise=b.stats.jump*b.stats.jump/5200*.9;let best=null,bs=1e9;
    for(const p of g.arena.platforms){
     const r=b.y-p.y;if(r<30||r>rise||p.y<gyT-70)continue;
     const cx=clamp(b.x,p.x+16,p.x+p.w-16),s=Math.abs(cx-b.x)+Math.abs(p.y-gyT)*1.4+Math.abs(tg.x-cx)*.35;
     if(s<bs){bs=s;best={p,cx}}
    }
    if(best){navX=best.cx;if(Math.abs(b.x-best.cx)<20){setDir(0);jump(.62);ai.lockT=1;ai.lockX=best.cx;return}}
   }else if(dy>80&&b.onPlat){
    navX=tg.x;
    if(adx<70){ks.add(DN);ai.blockT=.12;b.jumpBuf=.12;setDir(0);return}
   }
  }
  /* boss slam */
  if(b.boss&&b.bossKind!=='treant'){if(BossAI.run(b,g,ai,st,tg,dir,adx,air,setDir,jump))return}
  else if(b.boss){
   ai.spT-=st;
   if(!air&&b.atk.phase==='none'&&ai.spT<=0&&adx<560&&!b.stunT){
    ai.spT=rand(4.2,6.2)*(b.enraged?.72:1);b.slam=1;b.vy=-1120;b.onGround=false;b.coyote=0;setDir(dir);
    g.text(b.x,b.y-210,'SLAM!','#ff7a7a',28);Snd.play('jump');return;
   }
  }
  /* spacing and attacks */
  const punish=(tph==='rec'||tg.stunT>0||tg.hurtT>0)&&adx<reach+120;
  const waiting=ai.mode==='wait'&&tph==='none';
  const dd=waiting?treach+36+ai.ox*.4:reach*.8;
  let want=0;
  if(navX!==null)want=Math.abs(navX-b.x)>14?Math.sign(navX-b.x):0;
  else if(punish)want=adx>reach*.7?dir:0;
  else if(waiting)want=adx>dd+30?dir:(adx<dd-30?-dir:0);
  else want=adx>dd?dir:0;
  if(tg.blocking&&adx<reach*1.1&&!air&&navX===null&&Math.random()<.3+D.jump*.5){jump(.55);want=dir}
  else if(!air&&navX===null&&adx>160&&adx<300&&Math.random()<D.jump*.12){jump(.5);want=dir}
  setDir(want);
  const inReach=adx<reach*.95&&Math.abs(b.y-tg.y)<75;
  if(inReach&&b.atk.phase==='none'&&navX===null){
   const p=(waiting&&!punish)?D.aggr*.45:D.aggr;
   if(punish||Math.random()<p)b.atkBuf=.15;
  }
  if(!air&&want!==0&&Math.abs(b.x-ai.lastX)<3){ai.stuck+=st;if(ai.stuck>.55){ai.stuck=0;jump(.5)}}else ai.stuck=0;
  ai.lastX=b.x;
 }
};

 run(b,g,ai,st,tg,dir,adx,air,setDir,jump){

  if(S.mode){
   S.t-=st;S.sp-=st;b.f=dir||b.f;
   if(S.mode==='throw'){setDir(0);if(S.t<=0){this.boulder(b,g,tg);S.mode=null;S.cd=rand(3,5)*e}return true}
   if(S.mode==='rain'){setDir(0);if(S.sp<=0){S.sp=.26*e;const ps=g.fighters.filter(p=>!p.dead);for(const p of ps.slice(0,2))g.rain.push({x:clamp(p.x+rand(-110,110),30,W-30),y:-60,vy:1000,from:b,team:b.team,sw:BOSS_SHOTS.rock,rock:true})}
    if(S.t<=0){S.mode=null;S.cd=rand(3.5,5.5)*e}return true}
   if(S.mode==='breath'){
    setDir(0);b.breath=true;
    if(S.t<.7&&S.sp<=0){S.sp=.07;const ang=Math.atan2((tg.y-55)-(b.y-90*sc),Math.max(120,adx))+rand(-.2,.2);g.bossProj(b,BOSS_SHOTS.flame,ang,rand(700,980))}
    if(S.t<=0){S.mode=null;b.breath=false;S.cd=rand(2.6,4.2)*e}return true}
   if(S.mode==='sky'){
    const want=G-190;if(b.y>want)ai.keys.add(b.K?b.K.jump:b.keys.jump);else ai.keys.delete(b.keys.jump);
    const dx=tg.x-b.x;setDir(Math.abs(dx)>90?Math.sign(dx):0);b.f=Math.sign(dx)||b.f;
    if(S.sp<=0&&b.y<G-150){S.sp=.7*e;const ang=Math.atan2((tg.y-55)-(b.y-70*sc),Math.abs(dx)+1);for(let i=-1;i<=1;i++)g.bossProj(b,BOSS_SHOTS.flame,ang+i*.16,rand(760,900))}
    if(S.t<=0){S.mode=null;ai.keys.delete(b.keys.jump);if(b.abId==='fly')g.endAbility(b);S.cd=rand(2.5,4)*e}
    return true}
   S.mode=null;return false;
  }
  if(air||b.atk.phase!=='none'||b.stunT>0||S.cd>0)return false;

  const r=Math.random();
  if(k==='golem'){
   if(r<.34&&adx<560){S.cd=rand(4,6)*e;b.slam=1;b.vy=-960;b.onGround=false;b.coyote=0;setDir(dir);g.text(b.x,b.y-250,'GROUND POUND!','#ffb86b',28);Snd.play('jump');return true}
   if(r<.7&&adx>150){S.mode='throw';S.t=.8*e;g.text(b.x,b.y-250,'BOULDER!','#ffb86b',28);g.ring(b.x,b.y-120,'#ffb86b');b.f=dir;return true}
   S.mode='rain';S.t=3*e;S.sp=0;g.text(b.x,b.y-250,'ROCK FALL!','#ffb86b',28);g.shake=Math.max(g.shake,8);Snd.play('ko');return true;
  }
  if(k==='dragon'){
   if(r<.26){S.mode='breath';S.t=1.2;S.sp=0;g.text(b.x,b.y-230,'FIRE BREATH!','#ff9a3e',28);b.f=dir;return true}
   if(r<.5&&adx>140){const bx=clamp(tg.x-tg.f*80,40,W-40);g.smoke(b.x,b.y-60,6,1.4);b.x=bx;b.y=tg.y;b.vy=0;b.vx=0;b.f=Math.sign(tg.x-b.x)||b.f;g.smoke(b.x,b.y-60,6,1.4);g.ring(b.x,b.y-60,'#c084ff');g.text(b.x,b.y-230,'SHADOW DASH!','#c084ff',26);b.atkBuf=.2;S.cd=rand(2.4,3.6)*e;Snd.play('go');return true}
   if(r<.74){g.text(b.x,b.y-230,'SHADOW ORBS!','#c084ff',26);b.f=dir||b.f;for(let i=-1;i<=1;i++)g.bossProj(b,BOSS_SHOTS.orb,-.7+i*.5,520,{boss:true});S.cd=rand(3,4.5)*e;Snd.play('power');return true}
   S.mode='sky';S.t=4.2*e;S.sp=.4;b.abId='fly';b.abT=S.t+.8;b.vy=-380;b.onGround=false;g.text(b.x,b.y-230,'SKY BARRAGE!','#ff9a3e',28);Snd.play('go');return true;

/* ================= PARKOUR RACE ================= */
const PKZ=.66;
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* Random obstacle course. Every segment is built from safe distances (gaps <= 170px, climbs <= 85px). */
function buildCourse(seed){
 const rng=mulberry(seed),R=(a,b)=>a+(b-a)*rng();
 const C={ground:[],plats:[],walls:[],spikes:[],pads:[],cps:[],movers:[],signs:[],phys:[],segs:[]};
 const gr=(a,b)=>C.ground.push([a,b]);
 const pl=(x,h,w,mv)=>{const p={x,y:G-h,w};if(mv)Object.assign(p,mv);C.plats.push(p);return p};
 const sign=(x,s)=>C.signs.push({x,s});
 const segs={
  hop(x){let cx=x;for(let i=0;i<3;i++){cx+=R(110,165);const w=R(115,170);gr(cx,cx+w);cx+=w}return cx},
  steps(x){
   let cx=x+95,h=0;
   for(let i=0;i<3;i++){h+=R(58,82);const w=R(115,150);pl(cx,h,w);cx+=w+R(62,100)}
   for(let i=0;i<2;i++){h=Math.max(35,h-R(55,75));const w=R(115,150);pl(cx,h,w);cx+=w+R(62,100)}
   gr(cx,cx+10);return cx+10;
  },
  movers(x){
   sign(x+20,'RIDE');
   const Wp=R(430,500),w=130,amp=(Wp-w)/2-10;
   for(let k=0;k<2;k++)C.movers.push(pl(x+Wp/2-w/2,0,w,{cx:x+Wp/2,amp,ph:k*Math.PI,om:2*Math.PI/4.2}));
   gr(x+Wp,x+Wp+10);return x+Wp+10;
  },
  spikes(x){
   sign(x+30,'SPIKES');
   const L=1000;gr(x,x+L);
   for(let i=0;i<3;i++)C.spikes.push({x:x+170+i*285+R(-15,15),y:G,w:R(55,100)});
   return x+L;
  },
  shaft(x){
   sign(x+10,'WALL JUMP');
   const ww=40,inner=150,H=380,ax=x+90,bx=ax+ww+inner;
   gr(x,bx+ww+70);
   C.walls.push({x:ax,y:G-H,w:ww,h:H-110},{x:bx,y:G-H,w:ww,h:H});
   return bx+ww+70;
  },
  highs(x){
   /* high ledge, a wide pit to clear, then another high ledge: jump the pit or pour water to catch the fall */
   sign(x+10,'CLUTCH');
   /* a stair up to a high ledge, a long drop-off pit, then a second high ledge */
   gr(x,x+40);pl(x+40,90,90);pl(x+150,180,130);
   pl(x+420,180,130);
   return x+550;
  },
  stones(x){
   sign(x+10,'STONES');
   let cx=x+70;
   for(let i=0;i<5;i++){const w=R(78,100),h=i%2?R(70,100):R(30,60);pl(cx,h,w);cx+=w+R(120,150)}
   gr(cx-20,cx+10);return cx+10;
  },
  pad(x){
   sign(x+10,'BOUNCE PAD');
   gr(x,x+90);C.pads.push({x:x+30,y:G,w:55,t:0});
   pl(x+250,300,140);pl(x+470,165,130);
   gr(x+630,x+640);return x+640;
  }
 };
 gr(-80,560);C.startX=150;C.cps.push({x:150});
 let x=560;
 const order=['hop','steps','movers','spikes','pad','highs','hop','steps','movers','spikes','highs','pad','hop','steps','highs'].map(k=>[rng(),k]).sort((a,b)=>a[0]-b[0]).map(a=>a[1]);
 for(const k of order){const e=segs[k](x),rs=330;C.segs.push({k,x0:x,x1:e});gr(e,e+rs);C.cps.push({x:e+rs/2});x=e+rs}
 gr(x,x+440);C.finish=x+300;C.length=x+500;C.order=order;
 C.phys=C.plats.concat(C.walls.map(w=>({x:w.x,y:w.y,w:w.w})));
 return C;
}

Object.assign(Game,{
 pk:null,theme:null,pkCam:[{x:0,y:G},{x:0,y:G}],worldW:null,gaps:false,walls:null,
 resetWorld(){this.pk=null;this.gaps=false;this.worldW=null;this.walls=null;this.fighters.forEach(f=>{f.unarmed=false;f.noAtk=false;f.dashT=0;f.stunT=0})},
 hasGround(x){const g=this.pk.ground;for(let i=0;i<g.length;i++)if(x>=g[i][0]-6&&x<=g[i][1]+6)return true;return false},
 startParkour(){
  this.screen='battle';UI.hideScreen();this.bots=[];
  this.theme=ARENAS[this.arenaId]||ARENAS.training;
  this.match={pk:true,round:1,wins:[0,0],time:0,over:false,first:true,last:null,timer:0};
  this.startRace();
 },
 startRace(){
  const m=this.match;this.paused=false;UI.clearOverlay();
  const C=this.pk=buildCourse(Math.floor(Math.random()*1e9));
  this.arena={platforms:C.phys};this.worldW=C.length;this.gaps=true;this.walls=C.walls;
  this.fighters.forEach((f,i)=>{
   f.team=i;f.sc=1;f.look=null;f.unarmed=true;f.noAtk=true;
   f.setLoadout({sword:'wooden',armour:'none',ability:'none'},null);

      const pts=[];for(let j=0;j<=N;j++){const v=j/N,o=off(v);pts.push([hx+dx*v+nx*o,hy+dy*v+ny*o])}
      c.setLineDash([]);
      this.polyline(c,pts,'rgba(255,70,20,.32)',30,.9);
      this.polyline(c,pts,'rgba(255,140,40,.6)',16,.9);
      this.polyline(c,pts,'rgba(255,230,140,.95)',6,.95);
      this.polyline(c,pts,'#ffffff',2,.9);

/* ===== Co-op treasure chests, loot, glue walls =====
   Chests appear in waves 5, 11 and 12 (the first two bosses). Stand near one for 3 sec to open it.
   Loot per surviving player: a timed power (RAGE / SWIFT / IRON SKIN), +1 weapon upgrade, +2 glue walls.
   Glue wall: P1 presses C, P2 presses Enter. Bots that walk into it get stuck, take damage and break it. */
(()=>{
 const OPEN_TIME=3,CHEST_WAVES=[5,11,12],UPG_MAX=4,GLUE_HP=70;
 const BUFFS={rage:{name:'RAGE',t:15,col:'#ff8a5a'},swift:{name:'SWIFT',t:15,col:'#7fe0ff'},iron:{name:'IRON SKIN',t:15,col:'#ffe27a'}};
 const T={m:null,chest:null,walls:[],glue:[0,0],upg:[0,0],buff:[{},{}],base:[null,null]};
 const botSc=b=>b.sc||1;

 function ensure(){const m=Game.match;if(m&&T.m!==m){T.m=m;T.glue=[0,0];T.upg=[0,0];T.buff=[{},{}];T.walls=[];T.chest=null;T.base=[null,null]}return m}

 function newChest(){let x;do{x=rand(200,W-200)}while(Math.abs(x-W/2)<170);return {x,y:G,prog:0,open:false,openT:0,near:[false,false]}}

 function captureBase(){for(const f of Game.fighters)T.base[f.id]={dmg:f.stats.dmg,speed:f.stats.speed,reduce:f.stats.reduce}}

 function applyStats(){
  for(const f of Game.fighters){
   const b=T.base[f.id];if(!b)continue;const bf=T.buff[f.id]||{};
   f.stats.dmg=b.dmg*Math.pow(1.15,T.upg[f.id])*(bf.rage>0?1.5:1);
   f.stats.speed=b.speed*(bf.swift>0?1.35:1);
   f.stats.reduce=1-(1-b.reduce)*(bf.iron>0?.6:1);
  }
 }

 const _sw=Game.startWave;
 Game.startWave=function(n){
  _sw.call(this,n);
  const m=ensure();if(!m||!m.coop)return;
  T.walls=[];T.buff=[{},{}];
  captureBase();
  T.chest=CHEST_WAVES.includes(n)?newChest():null;
 };

 function openChest(c){
  c.open=true;c.openT=0;Snd.play('win');Game.shake=Math.max(Game.shake,6);
  Game.spark(c.x,c.y-30,30,'#ffd45a',480);Game.ring(c.x,c.y-30,'#ffd45a');
  Game.fighters.forEach((f,i)=>{
   if(f.dead||f.down)return;
   const keys=Object.keys(BUFFS),k=keys[Math.floor(Math.random()*keys.length)];
   T.buff[f.id][k]=BUFFS[k].t;
   T.upg[f.id]=Math.min(UPG_MAX,T.upg[f.id]+1);
   Game.addGlue(f.id,2);
   Game.addTraps(f.id,5);
   Game.text(f.x,f.y-150,BUFFS[k].name+' '+BUFFS[k].t+'s',BUFFS[k].col,20);
   Game.text(f.x,f.y-125,'WEAPON +1','#ffe27a',18);
   Game.text(f.x,f.y-100,'+2 GLUE WALLS','#c8ff9a',18);
  });
 }

 function stepChest(dt){
  const c=T.chest;if(!c)return;
  if(c.open){c.openT+=dt;return}
  c.near=Game.fighters.map(f=>!f.dead&&!f.down&&Math.abs(f.x-c.x)<80&&Math.abs(f.y-c.y)<140);
  if(c.near.some(Boolean))c.prog=Math.min(OPEN_TIME,c.prog+dt);
  else c.prog=Math.max(0,c.prog-dt*.5);
  if(c.prog>=OPEN_TIME)openChest(c);
 }

 function placeGlue(f){
  if(!f||f.dead||f.down)return false;
  const x=clamp(f.x+(f.f||1)*62,40,W-40);
  T.walls.push({x,y:f.y,w:30,h:98,hp:GLUE_HP,t:0,life:16,cd:new Map()});
  Game.ring(x,f.y-40,'#b8ff6a');Game.spark(x,f.y-50,16,'#c8ff9a',260);Snd.play('power');
  Game.text(f.x,f.y-125,'GLUE WALL','#c8ff9a',18);
  return true;
 }

 Game.placeWall=placeGlue;
 function stepWalls(dt){
  T.walls=T.walls.filter(w=>{
   w.t+=dt;
   if(w.hp<=0||w.t>w.life){Game.spark(w.x,w.y-40,18,'#b8ff6a',300);Game.ring(w.x,w.y-40,'#b8ff6a');return false}
   for(const b of Game.bots){
    if(b.dead)continue;
    const cd=w.cd.get(b)||0;if(cd>0)w.cd.set(b,cd-dt);
    const dx=b.x-w.x,R=w.w/2+16*botSc(b);
    if(Math.abs(dx)<R&&b.y>w.y-w.h&&b.y<=w.y+6){
     const side=dx>=0?1:-1;b.x=w.x+side*R;b.vx=0;   /* stuck in the glue */
     if(cd<=0){w.cd.set(b,.9);b.hp-=8;w.hp-=14;Game.text(b.x,b.y-130*botSc(b),'STUCK!','#c8ff9a',18);Game.spark(b.x,b.y-50*botSc(b),8,'#c8ff9a',220);Snd.play('hit')}
     w.hp-=6*dt;
    }
   }
   return true;
  });
 }

 function drawChest(ctx){
  const c=T.chest;if(!c)return;
  const x=c.x,y=c.y,o=c.open?Math.min(1,c.openT*3):0;
  ctx.save();
  if(c.open){
   ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,210,90,'+(.35*(1-o*.3)).toFixed(2)+')';
   ctx.beginPath();ctx.ellipse(x,y-30,64,44,0,0,6.283);ctx.fill();ctx.globalCompositeOperation='source-over';
  }
  ctx.fillStyle='#6a3e1e';ctx.strokeStyle='#2a1608';ctx.lineWidth=3;
  ctx.fillRect(x-26,y-26,52,26);ctx.strokeRect(x-26,y-26,52,26);
  if(c.open){ctx.fillStyle='#ffd45a';for(let k=0;k<5;k++){ctx.beginPath();ctx.arc(x-16+k*8,y-26,4,0,6.283);ctx.fill()}}
  const lift=o*18;
  ctx.fillStyle='#7d4b25';ctx.fillRect(x-26,y-38-lift,52,12);ctx.strokeRect(x-26,y-38-lift,52,12);
  ctx.fillStyle='#ffc83a';ctx.fillRect(x-26,y-38-lift,6,12);ctx.fillRect(x+20,y-38-lift,6,12);ctx.fillRect(x-4,y-40-lift,8,14);
  if(!c.open&&c.near.some(Boolean)){
   const lbl='stand for '+OPEN_TIME+' sec to open the treasure';
   ctx.font='700 11px '+BODY;ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#070b18';
   ctx.strokeText(lbl,x,y-70);ctx.fillStyle='#fff';ctx.fillText(lbl,x,y-70);
   ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x-45,y-64,90,5);
   ctx.fillStyle='#ffd45a';ctx.fillRect(x-45,y-64,90*(c.prog/OPEN_TIME),5);
  }
  ctx.restore();
 }

 function drawWalls(ctx){
  for(const w of T.walls){
   const fade=Math.min(1,(w.life-w.t)/1.5),hp=clamp(w.hp/GLUE_HP,0,1);
   ctx.save();ctx.globalAlpha=.85*fade;
   const g=ctx.createLinearGradient(w.x-w.w/2,0,w.x+w.w/2,0);
   g.addColorStop(0,'rgba(120,255,90,.55)');g.addColorStop(.5,'rgba(210,255,150,.9)');g.addColorStop(1,'rgba(120,255,90,.55)');
   ctx.fillStyle=g;ctx.strokeStyle='#5fbf3a';ctx.lineWidth=2;
   ctx.fillRect(w.x-w.w/2,w.y-w.h,w.w,w.h);ctx.strokeRect(w.x-w.w/2,w.y-w.h,w.w,w.h);
   ctx.fillStyle='#b8ff6a';
   for(let k=0;k<3;k++){const dx=-w.w/2+6+k*(w.w-12)/2,dl=6+4*Math.sin(w.t*3+k*2);ctx.beginPath();ctx.ellipse(w.x+dx,w.y,3,dl,0,0,6.283);ctx.fill()}
   ctx.globalAlpha=fade;ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(w.x-16,w.y-w.h-9,32,4);
   ctx.fillStyle='#b8ff6a';ctx.fillRect(w.x-16,w.y-w.h-9,32*hp,4);
   ctx.restore();
  }
 }

 Game.addGlue=function(id,n){ensure();T.glue[id]+=n};
 const origStepT=Game.step;
 Game.step=function(dt){
  origStepT.call(this,dt);
  if(!this.match||!this.match.coop)return;
  ensure();
  if(this.state!=='fight')return;
  for(const id of [0,1])for(const k in T.buff[id])if(T.buff[id][k]>0)T.buff[id][k]-=dt;
  applyStats();stepChest(dt);stepWalls(dt);
 };

 const origPressT=Game.press;
 Game.press=function(code){
  if((code==='KeyC'||code==='Enter')&&this.match&&this.match.coop&&this.state==='fight'&&!Net.running){
   placeGlue(this.fighters[code==='KeyC'?0:1]);return
  }

 };

 const origSuperDrawT=Game.superDraw;
 Game.superDraw=function(c){
  if(origSuperDrawT)origSuperDrawT.call(this,c);
  if(this.match&&this.match.coop&&T.m===this.match){drawChest(c);drawWalls(c)}
 };

 const origHudT=Game.hud;
 Game.hud=function(c){
  origHudT.call(this,c);
  const m=this.match;if(!m||!m.coop||T.m!==m)return;
  const hudTxt=(s,x,y,right)=>txt(c,s,x,y,{font:`700 11px ${BODY}`,fill:'#c8ff9a',align:right?'right':'left',stroke:'#070b18',sw:3});
  hudTxt('WEAPON +'+T.upg[0],16,184);
  if(!this.fighters[1].absent)hudTxt('WEAPON +'+T.upg[1],VW-16,184,true);
  const buffLine=i=>Object.keys(BUFFS).filter(k=>T.buff[i][k]>0).map(k=>BUFFS[k].name+' '+Math.ceil(T.buff[i][k])+'s').join('   ');
  const b0=buffLine(0),b1=buffLine(1);
  if(b0)txt(c,b0,16,200,{font:`700 11px ${BODY}`,fill:'#ffd09a',stroke:'#070b18',sw:3});
  if(b1)txt(c,b1,VW-16,200,{font:`700 11px ${BODY}`,fill:'#ffd09a',align:'right',stroke:'#070b18',sw:3});
 };
})();

/* ===== Glue wall drops: a defeated bot drops a glue wall pickup. Walk over it to collect. ===== */
(()=>{
 const DROPS=[];
 const origKillD=Game.kill;
 Game.kill=function(f){
  const drop=!!(f&&!f.dead&&f.team===1&&this.match&&this.match.coop);
  origKillD.call(this,f);
  if(drop){for(let i=0;i<(f.boss?2:1);i++)DROPS.push({x:f.x,y:f.y-60,vx:rand(-70,70)*(i?-1:1),vy:-430-i*60,landed:false,t:0,life:30,done:false})}
 };
 const origStepD=Game.step;

  origStepD.call(this,dt);

   d.t+=dt;
   if(!d.landed){
    d.vy+=1500*dt;d.y+=d.vy*dt;d.x=clamp(d.x+d.vx*dt,20,W-20);d.vx*=Math.pow(.15,dt);

     this.spark(d.x,d.y-10,10,'#c8ff9a',260);Snd.play('power');
     break;

   }
  }
  for(let i=DROPS.length-1;i>=0;i--)if(DROPS[i].done||DROPS[i].t>DROPS[i].life)DROPS.splice(i,1);
 };

/* ===== Shared inventory: 9 slots for both players. Keys 1-9 select a slot; E (Player 1) and Enter (Player 2) use it.
   Health kits and glue walls go into these slots, so there are no separate kit or glue keys any more. ===== */
(()=>{
 const SLOTS=9,STACK={kit:20,glue:20,trap:20},NAME={kit:'HEALTH KIT',glue:'GLUE WALL',trap:'TRAP'};
 const inv=m=>{if(!m.inv)m.inv={slots:Array(SLOTS).fill(null),sel:0};return m.inv};
 function addItem(m,id,f){
  const I=inv(m);
  let s=I.slots.findIndex(x=>x&&x.id===id&&x.n<STACK[id]);
  if(s<0)s=I.slots.findIndex(x=>!x);
  if(s<0){if(f)Game.text(f.x,f.y-125,'INVENTORY FULL','#ffb3a0',16);return false}
  if(!I.slots[s])I.slots[s]={id,n:0};
  I.slots[s].n++;
  if(f)Game.text(f.x,f.y-125,'+1 '+NAME[id],id==='kit'?'#9bf0b0':'#c8ff9a',18);
  return true;
 }
 function consume(m,idx){const I=inv(m),s=I.slots[idx];if(!s)return;s.n--;if(s.n<=0)I.slots[idx]=null}
 function useSel(f){
  const m=Game.match;if(!m||!m.coop||!f||f.dead||f.down||Game.state!=='fight')return;
  const I=inv(m),idx=I.sel,s=I.slots[idx];
  if(!s){Game.text(f.x,f.y-125,'SLOT '+(idx+1)+' EMPTY','#93a0d0',16);Snd.play('deny');return}
  if(s.id==='glue'){if(Game.placeWall(f))consume(m,idx);return}
  if(s.id==='trap'){if(Game.placeTrap(f))consume(m,idx);return}
  if(s.id==='kit'){
   if(f.hp>=f.stats.maxHp-.5){Game.text(f.x,f.y-125,'HEALTH FULL','#9bf0b0',18);return}
   const h=Math.max(30,Math.round(f.stats.maxHp*.3));f.hp=Math.min(f.stats.maxHp,f.hp+h);
   Game.text(f.x,f.y-125,'+'+h+' HP','#6dff9c',30);Game.ring(f.x,f.y-50,'#6dff9c');Game.spark(f.x,f.y-50,14,'#9bf0b0',300);
   Snd.play('power');consume(m,idx);
  }
 }

 /* glue walls from drops and chest loot go straight into the shared slots */
 Game.addGlue=function(id,n){const m=Game.match;if(!m)return;const f=Game.fighters[id];for(let k=0;k<n;k++)addItem(m,'glue',k?null:f)};
 /* per-player kit counters are replaced by the shared slots */
 Game.kitHud=function(){};
 /* lets other code add items to the shared slots (used by treasure loot) */
 Game.addItemTo=function(id,f){const m=Game.match;if(m)return addItem(m,id,f)};
 const stepPrevI=Game.step;
 Game.step=function(dt){
  stepPrevI.call(this,dt);
  const m=this.match;if(!m||!m.coop||!m.kits)return;
  for(let i=0;i<2;i++)while(m.kits[i]>0){if(!addItem(m,'kit',null))break;m.kits[i]--}
 };

 const pressPrevI=Game.press;
 Game.press=function(code){
  const m=this.match;
  if(m&&m.coop&&this.state==='fight'&&!Net.running){
   const dig=/^Digit([1-9])$/.exec(code);
   if(dig){inv(m).sel=+dig[1]-1;Snd.play('power');return}
   if(code==='KeyE'){useSel(this.fighters[0]);return}
   if(code==='Enter'){useSel(this.fighters[1]);return}
   if(code==='KeyC'||code==='KeyK')return;   /* old glue and heal keys are removed */
  }
  return pressPrevI.call(this,code);
 };

 const hudPrevI=Game.hud;
 Game.hud=function(c){
  hudPrevI.call(this,c);
  const m=this.match;if(!m||!m.coop||this.state!=='fight')return;
  const I=inv(m),S=34,G=6,total=SLOTS*S+(SLOTS-1)*G,x0=VW/2-total/2,y0=VH-92;
  txt(c,'SHARED ITEMS   1-9 select   E use',VW/2,y0-8,{font:`700 11px ${BODY}`,fill:'#e6ecff',align:'center',stroke:'#070b18',sw:3});
  for(let k=0;k<SLOTS;k++){
   const x=x0+k*(S+G),s=I.slots[k],sel=k===I.sel,cx=x+S/2,cy=y0+S/2;
   c.fillStyle='rgba(8,12,28,.82)';c.fillRect(x,y0,S,S);
   c.strokeStyle=sel?'#ffd45a':'#3a4a85';c.lineWidth=sel?3:2;c.strokeRect(x,y0,S,S);
   if(s&&s.id==='kit'){
    c.fillStyle='#f6f8ff';c.fillRect(cx-9,cy-9,18,18);c.fillStyle='#e8344a';c.fillRect(cx-2.5,cy-6,5,12);c.fillRect(cx-6,cy-2.5,12,5);
   }else if(s&&s.id==='trap'){
    c.fillStyle='#8d8f9c';c.strokeStyle='#070b18';c.lineWidth=1.2;c.fillRect(cx-9,cy-3,18,7);c.strokeRect(cx-9,cy-3,18,7);
    c.fillStyle='#ffb36b';for(const q of[-6,0,6]){c.beginPath();c.moveTo(cx+q-2.5,cy-3);c.lineTo(cx+q,cy-9);c.lineTo(cx+q+2.5,cy-3);c.fill()}
   }else if(s&&s.id==='glue'){
    c.fillStyle='rgba(150,255,110,.85)';c.strokeStyle='#2a6b1a';c.lineWidth=1.5;c.fillRect(cx-9,cy-9,18,18);c.strokeRect(cx-9,cy-9,18,18);
   }
   txt(c,String(k+1),x+4,y0+11,{font:`700 10px ${BODY}`,fill:sel?'#ffd45a':'#8da0d8',stroke:'#070b18',sw:2});
   if(s)txt(c,String(s.n),x+S-4,y0+S-4,{font:`700 11px ${BODY}`,fill:'#ffffff',align:'right',stroke:'#070b18',sw:3});
  }
 };
})();

/* ===== Traps: placed at the user's feet from the shared inventory. The first bot that steps on one is held
   in place for a moment and takes damage. A trap stays for 40 seconds if nothing triggers it. ===== */
(()=>{
 const TRAPS=[];
 Game.addTraps=function(id,n){const f=Game.fighters[id];for(let k=0;k<n;k++)Game.addItemTo('trap',k?null:f)};
 Game.placeTrap=function(f){
  if(!f||f.dead||f.down)return false;
  TRAPS.push({x:f.x,y:f.y,t:0,life:40,done:false});
  Game.ring(f.x,f.y-6,'#ffb36b');Snd.play('power');
  Game.text(f.x,f.y-125,'TRAP SET','#ffb36b',16);
  return true;
 };
 const origStepTp=Game.step;
 Game.step=function(dt){
  origStepTp.call(this,dt);
  if(!this.match||!this.match.coop||this.state!=='fight')return;
  for(const b of this.bots){
   if(b.dead||!b.trapHold)continue;
   b.trapHold.t-=dt;b.vx=0;b.x=b.trapHold.x;
   if(b.trapHold.t<=0)b.trapHold=null;
  }
  for(const tr of TRAPS){
   tr.t+=dt;
   if(tr.done)continue;
   for(const b of this.bots){
    if(b.dead||b.trapHold)continue;
    if(Math.abs(b.x-tr.x)<26&&Math.abs(b.y-tr.y)<14){
     tr.done=true;b.hp-=15;b.trapHold={x:b.x,t:1.6};
     this.text(b.x,b.y-130,'TRAPPED!','#ffb36b',18);this.spark(tr.x,tr.y-10,14,'#ffb36b',260);Snd.play('hit');
     break;
    }
   }
  }
  for(let i=TRAPS.length-1;i>=0;i--)if(TRAPS[i].done||TRAPS[i].t>TRAPS[i].life)TRAPS.splice(i,1);
 };
 const origSDTp=Game.superDraw;
 Game.superDraw=function(c){
  origSDTp.call(this,c);
  if(!this.match||!this.match.coop)return;
  for(const tr of TRAPS){
   const fade=Math.min(1,(tr.life-tr.t)/2);
   c.save();c.globalAlpha=.9*fade;
   c.fillStyle='#6e7080';c.strokeStyle='#070b18';c.lineWidth=1.5;
   c.beginPath();c.ellipse(tr.x,tr.y-3,14,4,0,0,6.283);c.fill();c.stroke();
   c.fillStyle='#d9dce8';for(const q of[-8,-3,3,8]){c.beginPath();c.moveTo(tr.x+q-2.5,tr.y-4);c.lineTo(tr.x+q,tr.y-11);c.lineTo(tr.x+q+2.5,tr.y-4);c.fill()}
   c.restore();
  }
 };
})();
})();</script>
<script>
/* Wallpaper effects: torch fire, wind-blown leaves, simple physics. Runs only while the menu is visible. */
(()=>{
 const bg=document.getElementById('bg'),cv=document.getElementById('fx');
 if(!bg||!cv)return;
 const ctx=cv.getContext('2d');
 const IW=1672,IH=941;                       /* wallpaper pixel size */
 const TORCHES=[{x:210,y:545,s:1.3},{x:1395,y:575,s:1.3},{x:830,y:510,s:.7},{x:1230,y:510,s:.7},{x:635,y:570,s:.6}];
 const rnd=(a,b)=>a+Math.random()*(b-a);
 let W=0,H=0,dpr=1,sc=1,ox=0,oy=0;
 const P=(x,y)=>[ox+x*sc,oy+y*sc];          /* wallpaper coords -> screen (cover, bottom aligned) */
 function fit(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=bg.clientWidth;H=bg.clientHeight;
  cv.width=Math.max(1,W*dpr);cv.height=Math.max(1,H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  sc=Math.max(W/IW,H*.6/IH);ox=(W-IW*sc)/2;oy=H-IH*sc;
  const wall=bg.querySelector('.wall');
  if(wall){const sz=(IW*sc)+'px '+(IH*sc)+'px',pos=ox+'px '+oy+'px';wall.style.backgroundSize=sz;wall.style.backgroundPosition=pos;wall.style.webkitMaskSize=sz;wall.style.maskSize=sz;wall.style.webkitMaskPosition=pos;wall.style.maskPosition=pos}
 }
 const fire=[],sparks=[];
 let t=0,wind=0,last=performance.now();

 function spawnFire(e){
  const [x,y]=P(e.x,e.y);
  fire.push({x:x+rnd(-4,4)*e.s*sc,y:y+rnd(-3,3)*sc,vx:rnd(-10,10),vy:rnd(-70,-125)*(.7+.3*e.s),
    life:0,max:rnd(.55,1.1),r:rnd(5,10)*e.s*sc});
 }
 function spawnSpark(e){
  const [x,y]=P(e.x,e.y);
  sparks.push({x:x+rnd(-3,3)*e.s*sc,y:y+rnd(-6,0)*sc,vx:rnd(-70,70),vy:rnd(-170,-280)*(.6+.4*e.s),
    life:0,max:rnd(.45,1.0),px:x,py:y});
 }
 const stars=[];for(let i=0;i<70;i++)stars.push({x:rnd(0,1672),y:rnd(0,330),ph:rnd(0,6.28),sp:rnd(.6,2.2),s:rnd(.6,1.6)});

 
 /* ---- menu polish: mouse parallax on the wallpaper, drifting maple leaves, warm dust, idle breath ---- */
 const reduceMotion=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 const coarse=!!(window.matchMedia&&matchMedia('(pointer: coarse)').matches);
 const wall=bg.querySelector('.wall');
 const PAR={mx:0,my:0,tx:0,ty:0,cx:0,cy:0,on:!reduceMotion&&!coarse};
 const MAPLE=['#e8642a','#f08a2e','#d9432b','#f2b84b','#c9702a','#8f2d1d'];
 const maples=[],dust=[];
 function spawnMaple(fresh){
  const z=rnd(.55,1.25);
  maples.push({x:fresh?rnd(0,W):-20,y:fresh?rnd(-40,H*.7):rnd(-30,H*.25),z,vy:(38+rnd(0,28))*z,vx:0,
   ph:rnd(0,6.28),wob:rnd(.8,1.6),rot:rnd(0,6.28),spin:rnd(-1.6,1.6)*z,
   size:rnd(5,9)*z*sc,col:MAPLE[Math.floor(Math.random()*MAPLE.length)],a:rnd(.55,.85)*(z>.9?1:.8),life:0});
 }
 function spawnDust(){dust.push({x:rnd(0,W),y:rnd(0,H),z:rnd(.3,1),ph:rnd(0,6.28),size:rnd(.6,1.6)*sc,life:0,max:rnd(8,16)})}
 function stepAmbient(dt){
  if(!reduceMotion&&W>0&&!maples.length&&!dust.length){for(let i=0;i<40;i++)spawnDust()}
  /* parallax: follow the mouse with easing, clamped so the wallpaper always covers the menu */
  if(wall){
   const k=1-Math.exp(-dt*2.4);
   PAR.cx+=(PAR.tx-PAR.cx)*k;PAR.cy+=(PAR.ty-PAR.cy)*k;
   const tf='translate3d('+PAR.cx.toFixed(2)+'px,'+PAR.cy.toFixed(2)+'px,0) scale(1.04)';
   wall.style.transform=tf;cv.style.transform=tf; /* the fire is drawn on the canvas, so it moves with the wallpaper */
  }
  if(reduceMotion)return;
  /* maple leaves: gradual spawn, wind carries them, slow spin and wobble, removed when off screen */
  
  for(let i=maples.length-1;i>=0;i--){
   const l=maples[i];l.life+=dt;
   l.vx+=((wind*.55*l.z-l.vx)*1.2)*dt;
   l.x+=(l.vx+Math.sin(t*1.3+l.ph)*12*l.z)*dt;
   l.y+=l.vy*dt*(1+.25*Math.sin(t*.7+l.ph));
   l.rot+=l.spin*dt+Math.sin(t*2+l.ph)*.8*dt;
   if(l.x>W+30||l.y>H+30||l.x<-60)maples.splice(i,1);
  }
  /* warm dust: very slow drift, wraps around the screen */
  for(let i=dust.length-1;i>=0;i--){
   const d=dust[i];d.life+=dt;
   d.x+=(wind*.12*d.z+Math.sin(t*.6+d.ph)*6*d.z)*dt;d.y-=(8+6*d.z)*dt;
   if(d.life>d.max||d.y<-10){dust.splice(i,1)}
  }
  if(dust.length<40&&Math.random()<dt*6)spawnDust();
 }
 function drawAmbient(){
  if(reduceMotion)return;
  ctx.save();
  for(const d of dust){
   const a=.22*Math.sin(Math.PI*Math.min(1,d.life/d.max))*d.z;
   ctx.globalAlpha=a;ctx.fillStyle='#fff1d6';ctx.beginPath();ctx.arc(d.x,d.y,d.size,0,6.283);ctx.fill();
  }
  for(const l of maples){
   ctx.save();ctx.translate(l.x,l.y);ctx.rotate(l.rot);
   ctx.scale(Math.cos(l.ph+l.life*3)*.5+.5,1);
   ctx.globalAlpha=l.a;ctx.fillStyle=l.col;
   ctx.beginPath();ctx.moveTo(0,-l.size);ctx.quadraticCurveTo(l.size*.9,-l.size*.2,0,l.size);ctx.quadraticCurveTo(-l.size*.9,-l.size*.2,0,-l.size);ctx.fill();
   ctx.restore();
  }
  ctx.restore();
 }
 window.addEventListener('pointermove',e=>{
  if(!PAR.on||e.pointerType==='touch'||!wall)return;
  const r=bg.getBoundingClientRect();if(!r.width)return;
  const nx=clamp((e.clientX-(r.left+r.width/2))/(r.width/2),-1,1),ny=clamp((e.clientY-(r.top+r.height/2))/(r.height/2),-1,1);
  PAR.tx=-nx*12;PAR.ty=-ny*7;
 });
 document.documentElement.addEventListener('mouseleave',()=>{PAR.tx=0;PAR.ty=0});
 window.addEventListener('blur',()=>{PAR.tx=0;PAR.ty=0});

 function step(dt){
  stepAmbient(dt);
  t+=dt;
  /* wind: a steady breeze with irregular gusts */
  const gust=Math.max(0,Math.sin(t*.37)*Math.sin(t*.91+1.3));
  wind=45+80*gust+28*Math.sin(t*.23)+10*Math.sin(t*2.1)+rnd(-4,4)*dt*10;
  /* fire: buoyancy pulls up, turbulence jitters, wind pushes sideways */
  for(let i=fire.length-1;i>=0;i--){
   const f=fire[i];f.life+=dt;
   if(f.life>f.max){fire.splice(i,1);continue}
   f.vx+=((wind*.5-f.vx)*.9+rnd(-40,40))*dt;
   f.vy+=-30*dt;
   f.x+=f.vx*dt;f.y+=f.vy*dt;
  }
  /* sparks: hot, fast, short-lived; gravity pulls them down, wind carries them */
  for(let i=sparks.length-1;i>=0;i--){
   const k=sparks[i];k.life+=dt;
   if(k.life>k.max){sparks.splice(i,1);continue}
   k.px=k.x;k.py=k.y;
   k.vx+=((wind*.6-k.vx)*1.2+rnd(-50,50))*dt;
   k.vy+=220*dt;
   k.x+=k.vx*dt;k.y+=k.vy*dt;
  }
 }

 function draw(){
  drawAmbient();
  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  /* sky: faint twinkling stars and a soft pulsing glow around the moon */
  const [mx,my]=P(1135,170);
  const pulse=.5+.5*Math.sin(t*1.1);
  const mg=ctx.createRadialGradient(mx,my,40*sc,mx,my,260*sc);
  mg.addColorStop(0,'rgba(255,90,90,'+(.10+.06*pulse).toFixed(3)+')');mg.addColorStop(1,'rgba(255,60,60,0)');
  ctx.fillStyle=mg;ctx.fillRect(mx-260*sc,my-260*sc,520*sc,520*sc);
  for(const st of stars){
   const [x,y]=P(st.x,st.y);
   const a=.25+.6*Math.max(0,Math.sin(t*st.sp+st.ph));
   ctx.fillStyle='rgba(255,235,235,'+a.toFixed(3)+')';
   ctx.beginPath();ctx.arc(x,y,st.s*1.4*sc,0,6.283);ctx.fill();
  }
  for(const e of TORCHES){
   const [x,y]=P(e.x,e.y);
   const R=(80*e.s*sc)*(.85+.15*Math.sin(t*17+e.x)+rnd(-.03,.03));
   const g=ctx.createRadialGradient(x,y,0,x,y,R);
   g.addColorStop(0,'rgba(255,150,50,.45)');g.addColorStop(1,'rgba(255,80,20,0)');
   ctx.fillStyle=g;ctx.fillRect(x-R,y-R,2*R,2*R);
  }
  for(const f of fire){
   const k=f.life/f.max;
   const c=k<.3?'255,240,170':k<.65?'255,140,40':'220,50,20';
   ctx.fillStyle='rgba('+c+','+(.9*(1-k)).toFixed(3)+')';
   ctx.beginPath();ctx.arc(f.x,f.y,Math.max(.5,f.r*(1-k*.7)),0,6.283);ctx.fill();
  }
  for(const k of sparks){
   const a=1-k.life/k.max;
   ctx.strokeStyle='rgba(255,236,150,'+(a*.9).toFixed(3)+')';
   ctx.lineWidth=Math.max(.8,1.6*a)*sc;
   ctx.beginPath();ctx.moveTo(k.px,k.py);ctx.lineTo(k.x,k.y);ctx.stroke();
   ctx.fillStyle='rgba(255,250,210,'+a.toFixed(3)+')';
   ctx.beginPath();ctx.arc(k.x,k.y,1.3*sc,0,6.283);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  ctx.lineCap='round';
  ctx.globalAlpha=1;
 }

 function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(W>0&&+getComputedStyle(bg).opacity>.5){
   step(dt);
   for(const e of TORCHES){
    e.acc=(e.acc||0)+dt*60*e.s;
    while(e.acc>=1){spawnFire(e);e.acc-=1}
    e.sacc=(e.sacc||0)+dt*14*e.s;
    while(e.sacc>=1){spawnSpark(e);e.sacc-=1}
   }
   draw();
  }
  requestAnimationFrame(frame);
 }
 window.addEventListener('resize',fit);
 fit();
 requestAnimationFrame(frame);
})();
</script>
<script>
/* Parkour water (Minecraft style): a pour makes a water source that keeps spreading sideways over the surface
   below you and stays put. Stand in it and press your kit key with an empty bucket to scoop it back up. */
(()=>{
 const GG=window.__game.Game,G=470,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 const SPREAD=130,MAX_HALF=190;            /* px per second, max half-width of a pool */
 const surfaceUnder=f=>{
  let best=null;
  for(const p of GG.arena.platforms){
   if(p.water)continue;
   if(f.x>=p.x-10&&f.x<=p.x+p.w+10&&p.y>=f.y-6&&(best===null||p.y<best))best=p.y;
  }
  return best===null?G:best;
 };
 const pour=f=>{
  const pk=GG.pk,s=surfaceUnder(f);
  const pool={s,fx:f.x,fy:f.y,t:0,half:24};
  pool.plat={x:f.x-pool.half,y:s,w:pool.half*2,water:true,pool};
  pk.water=pk.water||[];pk.water.push(pool);GG.arena.platforms.push(pool.plat);
  f.bk='empty';
  GG.ring(f.x,s-4,'#7fd6ff');GG.spark(f.x,s-6,12,'#bfe9ff',300);
  GG.text(f.x,f.y-110,'WATER!','#7fd6ff',16);
 };
 const removePool=(pk,pool)=>{
  const k=GG.arena.platforms.indexOf(pool.plat);if(k>=0)GG.arena.platforms.splice(k,1);
  const i=pk.water.indexOf(pool);if(i>=0)pk.water.splice(i,1);
 };
 const origPressW=GG.press;
 GG.press=function(code){
  if(this.pk&&this.match&&this.match.pk&&this.state==='fight'&&!(typeof Net!=='undefined'&&Net.running)){
   const f=this.fighters.find(x=>x.keys&&x.keys.kit===code);
   if(f){
    if(f.standPf&&f.standPf.water){
     if(f.bk==='empty'){
      removePool(this.pk,f.standPf.pool);f.bk='full';
      GG.text(f.x,f.y-110,'SCOOPED','#7fd6ff',16);
     }
    }else if(f.bk==='full'){pour(f)}
    return;
   }
  }
  return origPressW.call(this,code);
 };
 const origStartRace=GG.startRace;
 GG.startRace=function(){
  origStartRace.call(this);
  this.pk.water=[];
 };
 const origRules=GG.pkRules;
 GG.pkRules=function(){
  origRules.call(this);
  const pk=this.pk;if(!pk||!pk.water)return;
  for(const w of pk.water){
   w.t+=1/60;
   w.half=Math.min(MAX_HALF,w.half+SPREAD/60);
   w.plat.x=w.fx-w.half;w.plat.w=w.half*2;
  }
 };
 const origWorld=GG.pkWorld;
 GG.pkWorld=function(c,C,A,xa,xb,t,me){
  origWorld.apply(this,arguments);
  for(const w of (this.pk&&this.pk.water)||[]){
   const x=w.plat.x,W=w.plat.w;
   if(x+W<xa||x>xb)continue;
   c.save();
   if(w.t<.5){ /* falling stream */
    const u=w.t/.5,y=w.fy+(w.s-w.fy)*u;
    c.strokeStyle='rgba(150,220,255,.85)';c.lineWidth=5;c.lineCap='round';
    c.beginPath();c.moveTo(w.fx,w.fy-8);c.lineTo(w.fx,y);c.stroke();
   }
   c.fillStyle='rgba(40,130,220,.55)';c.fillRect(x,w.s,W,16);
   c.fillStyle='rgba(190,235,255,.8)';c.fillRect(x,w.s-1+Math.sin(t*4+x*.05)*.4,W,2.5);
   c.fillStyle='rgba(255,255,255,.25)';c.fillRect(x+10,w.s+4,Math.max(0,W-20),2);
   c.restore();
  }
 };
})();
</script>
<script>
/* Co-op vs Bots is single-player now: Player 2 is removed from the match (no fighter, no input, no HUD). */
(()=>{
 const GG=window.__game.Game,G=470,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 const removeP2=()=>{
  const p2=GG.fighters[1];
  if(!p2)return;
  p2.absent=true;p2.dead=true;p2.down=false;p2.hp=0;p2.x=-9999;p2.y=G;p2.vx=0;p2.vy=0;

 };
 const origStartCoop=GG.startCoop;

<script>
/* Single player: Player 2 no longer exists. Co-op: slot 2 is removed. Duels: slot 2 is replaced by a bot opponent. */
(()=>{
 const GG=window.__game.Game;
 const removeP2=()=>{
  const p2=GG.fighters[1];if(!p2)return;
  p2.absent=true;p2.dead=true;p2.down=false;p2.hp=0;p2.x=-9999;p2.y=470;p2.vx=0;p2.vy=0;
 };
 const makeBot=()=>{
  const old=GG.fighters[1];if(!old||old.isBot)return;
  const b=GG.spawnBot('grunt',1,old.x);
  const k=GG.bots.indexOf(b);if(k>=0)GG.bots.splice(k,1);
  b.isBot=true;b.reset(old.x,-1);
  GG.fighters[1]=b;
 };
 for(const k of Object.keys(GG)){
  if(!/^start/.test(k)||typeof GG[k]!=='function')continue;
  const orig=GG[k];
  GG[k]=function(){
   const r=orig.apply(this,arguments);
   const nick=((window.__game.Save.data.profiles[0].nick||'').trim())||'PLAYER 1';
   if(this.fighters[0])this.fighters[0].name=nick;
   if(window.__net&&window.__net.running){}
   else if(this.match&&this.match.coop)removeP2();
   else if(this.match&&!this.match.pk)makeBot();
   return r;
  };
 }
})();
</script>
